name: Build MiniOS ESP32-S3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and configure arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv ./bin/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli version

          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.4
          arduino-cli lib install "lvgl@9.2.2" "LovyanGFX@1.2.0" "ArduinoJson"

      - name: Copy custom partitions.csv and lv_conf.h
        run: |
          cp partitions.csv MiniOS/partitions.csv
          cp lv_conf.h MiniOS/lv_conf.h
          mkdir -p "$HOME/Arduino/libraries"
          ln -sfn "$(pwd)/lv_conf.h" "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compile MiniOS for ESP32-S3-WROOM-1 N16R8
        run: |
          mkdir -p build_out
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=custom,CDCOnBoot=cdc,DebugLevel=none \
            --output-dir build_out \
            MiniOS 2>&1 | tee build_out/compile.log

      - name: Report Flash and RAM usage and prepare OTA/OTG binaries
        run: |
          echo "=== Memory Usage ==="
          grep -E "(Sketch uses|Global variables use)" build_out/compile.log || true
          echo "=== Files in build_out ==="
          find build_out -maxdepth 3 -type f | sort

          APP_BIN=$(find build_out -type f -name "MiniOS*.bin" ! -name "*bootloader*" ! -name "*partitions*" ! -name "*minios_*" | head -n 1)
          PART_SRC=$(find build_out -type f -name "*partitions*.bin" | head -n 1)
          BOOT_SRC=$(find build_out -type f -name "*bootloader*.bin" | head -n 1)

          echo "APP_BIN=$APP_BIN"
          echo "PART_SRC=$PART_SRC"
          echo "BOOT_SRC=$BOOT_SRC"

          test -n "$APP_BIN"
          test -n "$PART_SRC"
          test -n "$BOOT_SRC"

          cp "$APP_BIN" build_out/minios_app_0x10000.bin
          cp "$PART_SRC" build_out/MiniOS.ino.partitions.bin

          python3 - <<EOF
          import os

          boot_path = "$BOOT_SRC"
          part_path = "$PART_SRC"
          app_path = "$APP_BIN"
          full_path = "build_out/minios_full_0x0.bin"

          img = bytearray(b"\\xff" * (0x10000 + os.path.getsize(app_path)))

          with open(boot_path, "rb") as f:
              b_data = f.read()
          img[0x0:0x0 + len(b_data)] = b_data

          with open(part_path, "rb") as f:
              p_data = f.read()
          img[0x8000:0x8000 + len(p_data)] = p_data

          with open(app_path, "rb") as f:
              a_data = f.read()
          img[0x10000:0x10000 + len(a_data)] = a_data

          with open(full_path, "wb") as f:
              f.write(img)

          print(f"Full image size: {len(img)} bytes")
          print(f"App image size:  {len(a_data)} bytes")
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minios-esp32s3-bins
          path: |
            build_out/minios_full_0x0.bin
            build_out/minios_app_0x10000.bin
            build_out/MiniOS.ino.partitions.bin

      - name: Publish to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MiniOS Build #${{ github.run_number }}
          body: |
            ### Прошивка с телефона через ESP Flasher (OTG)
            - **Полный образ (`minios_full_0x0.bin`)**: шить с адреса `0x0` (первая прошивка или восстановление таблицы разделов).
            - **Только прошивка (`minios_app_0x10000.bin`)**: компактный образ для адреса `0x10000` (быстрая перезапись без трогания LittleFS).
            - **Рекомендация**: в ESP Flasher установите **Stub = off** для стабильной прошивки по USB OTG.
          files: |
            build_out/minios_full_0x0.bin
            build_out/minios_app_0x10000.bin
